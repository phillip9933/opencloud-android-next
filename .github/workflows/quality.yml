name: Quality and visual regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests, goldens, and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned offline scanner SDK
        run: python scripts/install_offline_scanner_sdk.py

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6

      - name: Test optional translation validation
        run: python scripts/test_locale_validator.py

      - name: Validate existing translations and format tokens (English fallback allowed)
        shell: pwsh
        run: ./scripts/validate-locale-resources.ps1 -Locale de
      - name: Verify formatting
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run static analysis
        run: ./gradlew detekt --no-daemon

      - name: Verify Compose goldens
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon

      - name: Build and run unit tests
        run: ./gradlew testDebugUnitTest :app:lintRelease assembleDebug assembleRelease --no-daemon

      - name: Upload reports and visual diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports-and-visual-diffs
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
